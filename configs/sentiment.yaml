# Sentiment analysis configuration

# Analysis settings
analysis:
  default_time_window_days: 30  # Default lookback when not specified
  max_time_window_days: 90      # Maximum lookback allowed
  max_articles: 10              # Maximum articles to consider
  recency_weight: 0.3           # Weight factor for recent news in weighted scoring

# Confidence thresholds based on number of articles
confidence_thresholds:
  very_high: 10
  high: 5
  medium: 3
  low: 2
  very_low: 1

# Sentiment score thresholds for classification
score_thresholds:
  very_positive: 0.6
  positive: 0.3
  neutral_high: 0.1
  neutral_low: -0.1
  negative: -0.3
  very_negative: -0.6

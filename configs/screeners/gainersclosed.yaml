name: gainersclosed
description: "Top gainers based on day open vs day close (regular session performance)"
enabled: true

# Session validation - only when markets are closed
valid_sessions:
  - "closed"

# Data source
data_source:
  universe: "default_universe"
  require_recent_trading: true

# Filters for day session gainers (open to close performance)
filters:
  # Require valid day open and close prices
  - field: "day_open"
    operator: "IS NOT NULL"
    value: null

  - field: "day_close"
    operator: "IS NOT NULL"
    value: null

  # Minimum gain of 2% from day open to day close
  - field: "((day_close - day_open) / day_open * 100)"
    operator: ">="
    value: 2.0

  # Minimum volume threshold for liquidity
  - field: "day_volume"
    operator: ">="
    value: 100000

# Sort by day performance (largest gains first)
sort:
  - field: "((day_close - day_open) / day_open * 100)"
    direction: "desc"

# Display configuration
display:
  limit: 50
  columns:
    - name: "Symbol"
      field: "symbol"
      width: 8
    - name: "Day Open"
      field: "day_open"
      format: "price"
      width: 10
    - name: "Day Close"
      field: "day_close"
      format: "price"
      width: 10
    - name: "Day Gain %"
      field: "((day_close - day_open) / day_open * 100)"
      format: "percent"
      width: 10
    - name: "Volume"
      field: "day_volume"
      format: "volume"
      width: 10
    - name: "Current"
      field: "min_close"
      format: "price"
      width: 10
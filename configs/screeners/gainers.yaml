name: gainers
description: "Top gaining stocks"
enabled: true

# Valid in all sessions - adapts behavior based on current session
valid_sessions:
  - "premarket"
  - "regular"
  - "afterhours"
  - "closed"

# Data source configuration
data_source:
  universe: "default_universe"
  require_recent_trading: true

# Field mappings - what each concept means per session
field_mapping:
  reference_price:
    # What price to compare against for gain calculation
    premarket: "ap.prevday_close"      # Compare to previous day's close (gap)
    regular: "ap.day_open"              # Compare to today's open (intraday movement)
    afterhours: "ap.day_close"          # Compare to today's 4PM close
    closed: "ap.prevday_close"          # Compare to previous day's close

  current_price:
    # What price represents "now"
    premarket: "ap.min_close"           # Premarket current price
    regular: "ap.min_close"             # Regular hours current price
    afterhours: "ap.min_close"          # After-hours current price
    closed: "ap.day_close"              # Last regular session close

  volume_field:
    # Which volume to display
    premarket: "ap.min_accumulated_volume"   # Accumulated volume (min.av works in PM)
    regular: "ap.day_volume"                 # Regular session volume (day.v - accurate)
    afterhours: null                         # PROBLEM: min.av unreliable in AH (can be < day.v)
    closed: "ap.prevday_volume"              # Previous day's volume (prevDay.v)

# Thresholds - can be session-specific
thresholds:
  min_gain_percent:
    premarket: 2.0
    regular: 2.0
    afterhours: 2.0
    closed: 2.0

  min_price:
    premarket: 1.0
    regular: 1.0
    afterhours: 1.0
    closed: 1.0

# Filters - use template variables that get resolved per session
filters:
  # Reference price must exist
  - field: "{{reference_price}}"
    operator: "IS NOT NULL"
    value: null

  # Gain percentage filter
  - field: "(({{current_price}} - {{reference_price}}) / {{reference_price}} * 100)"
    operator: ">="
    value: "{{thresholds.min_gain_percent}}"

  # Minimum price filter
  - field: "{{current_price}}"
    operator: ">="
    value: "{{thresholds.min_price}}"

# Sorting - highest gainers first
sort:
  - field: "(({{current_price}} - {{reference_price}}) / {{reference_price}} * 100)"
    direction: "desc"

# Display configuration - context-specific columns
display:
  limit: 50
  columns:
    base:
      # Always shown
      - name: "Symbol"
        field: "symbol"
        width: 8

    context_specific:
      premarket:
        - name: "Prev Close"
          field: "prevday_close"
          format: "price"
          width: 10
        - name: "PM Price"
          field: "min_close"
          format: "price"
          width: 10
        - name: "PM Change"
          field: "min_close - prevday_close"
          format: "price_change"
          width: 12
        - name: "PM Gap %"
          field: "((min_close - prevday_close) / prevday_close * 100)"
          format: "percent"
          width: 12
        - name: "PM Volume"
          field: "min_accumulated_volume"
          format: "volume"
          width: 10
        - name: "Time"
          field: "min_timestamp_formatted"
          width: 12

      regular:
        - name: "Day Open"
          field: "day_open"
          format: "price"
          width: 10
        - name: "Current"
          field: "min_close"
          format: "price"
          width: 10
        - name: "Change"
          field: "min_close - day_open"
          format: "price_change"
          width: 12
        - name: "Change %"
          field: "((min_close - day_open) / day_open * 100)"
          format: "percent"
          width: 12
        - name: "Volume"
          field: "day_volume"
          format: "volume"
          width: 10
        - name: "Time"
          field: "min_timestamp_formatted"
          width: 12

      afterhours:
        - name: "4PM Close"
          field: "day_close"
          format: "price"
          width: 10
        - name: "AH Price"
          field: "min_close"
          format: "price"
          width: 10
        - name: "AH Change"
          field: "min_close - day_close"
          format: "price_change"
          width: 12
        - name: "AH Change %"
          field: "((min_close - day_close) / day_close * 100)"
          format: "percent"
          width: 12
        - name: "Time"
          field: "min_timestamp_formatted"
          width: 12

      closed:
        - name: "Prev Close"
          field: "prevday_close"
          format: "price"
          width: 10
        - name: "Last Close"
          field: "day_close"
          format: "price"
          width: 10
        - name: "Change"
          field: "day_close - prevday_close"
          format: "price_change"
          width: 12
        - name: "Change %"
          field: "((day_close - prevday_close) / prevday_close * 100)"
          format: "percent"
          width: 12
        - name: "Volume"
          field: "prevday_volume"
          format: "volume"
          width: 10

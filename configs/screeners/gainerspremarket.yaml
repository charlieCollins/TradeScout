name: gainerspremarket
description: "Premarket gainers (gap up from previous close)"
enabled: true

# Session validation - when this screener should run
valid_sessions:
  - "premarket"

# Data source configuration
data_source:
  universe: "default_universe"
  require_recent_trading: true  # Only include if provider_updated > 0

# Filter criteria - will be converted to SQL WHERE clauses
filters:
  - field: "((min_close - prevday_close) / prevday_close * 100)"
    operator: ">="
    value: 2.0
  - field: "min_close"
    operator: ">="
    value: 1.0

# Sorting configuration
sort:
  - field: "((min_close - prevday_close) / prevday_close * 100)"
    direction: "desc"

# Display configuration
display:
  limit: 50
  columns:
    - name: "Symbol"
      field: "symbol"
      width: 10
    - name: "Name"
      field: "name"
      width: 30
    - name: "Last"
      field: "min_close"
      format: "price"
    - name: "Change"
      field: "change_dollar"
      format: "price_change"
    - name: "Change %"
      field: "change_percent"
      format: "percent"
    - name: "Volume"
      field: "min_volume"
      format: "volume"
name: gaps
description: "Stocks with significant gap ups/downs"
enabled: true

# Session validation - gaps can be detected in any trading session
valid_sessions:
  - "premarket"
  - "regular"
  - "afterhours"

# Data source configuration
data_source:
  universe: "default_universe"
  require_recent_trading: true

# Filter criteria - gap is when current price significantly differs from prev close
filters:
  - field: "ABS(change_percent)"
    operator: ">="
    value: 3.0  # At least 3% gap
  - field: "min_close"
    operator: ">="
    value: 5.0  # Price above $5

# Sorting configuration
sort:
  - field: "ABS(change_percent)"
    direction: "desc"

# Display configuration
display:
  limit: 50
  columns:
    - name: "Symbol"
      field: "symbol"
      width: 10
    - name: "Name"
      field: "name"
      width: 30
    - name: "Prev Close"
      field: "prevday_close"
      format: "price"
    - name: "Current"
      field: "min_close"
      format: "price"
    - name: "Gap"
      field: "change_dollar"
      format: "price_change"
    - name: "Gap %"
      field: "change_percent"
      format: "percent"
    - name: "Volume"
      field: "min_volume"
      format: "volume"
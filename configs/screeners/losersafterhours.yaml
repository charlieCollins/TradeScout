name: losersafterhours
description: "Afterhours losers (vs regular session close)"
enabled: true

# Session validation - when this screener should run
valid_sessions:
  - "afterhours"
  - "closed"

# Data source configuration
data_source:
  universe: "default_universe"
  require_recent_trading: true

# Filter criteria - afterhours vs regular session close
filters:
  - field: "day_close"
    operator: "IS NOT NULL"
    value: null  # Must have regular session close data
  - field: "((min_close - day_close) / day_close * 100)"
    operator: "<="
    value: -2.0  # Looking for losses of 2% or more
  - field: "min_close"
    operator: ">="
    value: 1.0

# Sorting configuration - sort by most negative change (biggest losers first)
sort:
  - field: "((min_close - day_close) / day_close * 100)"
    direction: "asc"  # Ascending to get most negative first

# Display configuration
display:
  limit: 50
  columns:
    - name: "Symbol"
      field: "symbol"
      width: 8
    - name: "Name"
      field: "name"
      width: 25
    - name: "4PM Close"
      field: "day_close"
      format: "price"
      width: 10
    - name: "Current"
      field: "min_close"
      format: "price"
      width: 10
    - name: "AH Change"
      field: "min_close - day_close"
      format: "price_change"
      width: 12
    - name: "AH Change %"
      field: "((min_close - day_close) / day_close * 100)"
      format: "percent"
      width: 12
    - name: "AH Volume"
      field: "min_volume"
      format: "volume"
      width: 10
    - name: "Time"
      field: "min_timestamp_formatted"
      width: 12
# Provider Configuration for TradeScout
# Defines which provider to use for each data type
# All defaults are now FREE providers - $0/month operation

providers:
  # Snapshot data (current prices, OHLCV)
  # Options: yfinance (free - bulk supported), polygon (paid), alpaca (free - single ticker only)
  snapshot:
    default: "yfinance"
    fallback: ["polygon", "alpaca"]

  # Aggregates/bars data (historical, minute-level)
  # Options: yfinance (free - daily + limited intraday), polygon (paid - full intraday)
  aggregates:
    default: "yfinance"
    fallback: ["polygon"]

  # News and sentiment
  # Options: finnhub (free - 60 req/min), polygon (paid)
  news:
    default: "finnhub"
    fallback: ["polygon"]

  # Market status and holidays
  # Options: pandas_market_calendars (free - local, no API calls), polygon (paid)
  market_status:
    default: "pandas_market_calendars"
    fallback: ["polygon"]

  # Reference data (tickers, exchanges, single-ticker details)
  # Options: yfinance (free - single ticker details), polygon (paid - bulk ticker listing)
  # Note: Bulk tickers come from NASDAQ Trader (bootstrap). Bulk fundamentals from SEC EDGAR (bootstrap).
  reference:
    default: "yfinance"
    fallback: ["polygon"]

  # Fundamentals (bulk company data: SIC codes, shares outstanding, market cap)
  # SEC EDGAR bulk downloads (free, no API key, 10 req/sec rate limit)
  # Used by bootstrap-fundamentals, not via provider factory
  fundamentals:
    default: "edgar"

  # Economic data (Fed, inflation, yields)
  # Options: fred (free - requires FRED_API_KEY), polygon (paid)
  economic:
    default: "fred"
    fallback: ["polygon"]

# API keys are read from environment variables:
# FREE:
# - FINNHUB_API_KEY (news - free tier: 60 req/min)
# - FRED_API_KEY (economic - free at https://fred.stlouisfed.org/docs/api/api_key.html)
# NO KEY NEEDED:
# - yfinance (snapshot, aggregates, reference - unofficial, no key)
# - pandas_market_calendars (market status - local computation)
# PAID (optional fallback):
# - POLYGON_API_KEY (all data types - paid tiers)
# - ALPACA_API_KEY + ALPACA_SECRET_KEY (snapshot alternative)

# Provider capabilities:
# +----------------------+-----------+-------------+-----------+------------------------------+
# | Data Type            | Polygon   | Free        | Free Key? | Notes                        |
# +----------------------+-----------+-------------+-----------+------------------------------+
# | Snapshots (bulk)     | Yes       | yfinance    | No        | Unofficial but free          |
# | Aggregates (daily)   | Yes       | yfinance    | No        | Full daily history           |
# | Aggregates (minute)  | Yes       | yfinance    | No        | Last 30 days only            |
# | News                 | Yes       | finnhub     | Yes       | 60 req/min free              |
# | Market Status        | Yes       | pandas      | No        | Local computation            |
# | Reference (single)   | Yes       | yfinance    | No        | Ticker details               |
# | Reference (bulk)     | Yes       | NASDAQ Tdr  | No        | Bootstrap tickers            |
# | Fundamentals (bulk)  | N/A       | SEC EDGAR   | No        | SIC, shares, market cap      |
# | Economic/Fed         | Yes       | fred        | Yes       | Free FRED API key            |
# +----------------------+-----------+-------------+-----------+------------------------------+

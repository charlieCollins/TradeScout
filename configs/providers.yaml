# Provider Configuration for TradeScout
# Defines which provider to use for each data type

providers:
  # Snapshot data (current prices, OHLCV)
  # Options: polygon (paid), alpaca (free - single ticker only)
  snapshot:
    default: "polygon"
    fallback: []

  # Aggregates/bars data (historical, minute-level)
  # Options: polygon (paid only - no free alternative yet)
  aggregates:
    default: "polygon"
    fallback: []

  # News and sentiment
  # Options: polygon (paid), finnhub (free - 60 req/min)
  news:
    default: "finnhub"
    fallback: ["polygon"]

  # Market status and holidays
  # Options: polygon (paid), pandas_market_calendars (free - local, no API calls)
  market_status:
    default: "pandas_market_calendars"
    fallback: ["polygon"]

  # Reference data (tickers, exchanges, fundamentals)
  # Options: polygon (paid only - no free alternative yet)
  reference:
    default: "polygon"
    fallback: []

  # Economic data (Fed, inflation, yields)
  # Options: polygon (paid only - FRED planned but not implemented)
  economic:
    default: "polygon"
    fallback: []

# API keys are read from environment variables:
# - POLYGON_API_KEY (required for: snapshot, aggregates, reference, economic)
# - FINNHUB_API_KEY (required for: news when using finnhub)
# - ALPACA_API_KEY + ALPACA_SECRET_KEY (optional: snapshot alternative)

# Provider capabilities summary:
# +----------------------+----------+---------+------------------+
# | Data Type            | Polygon  | Free    | Notes            |
# +----------------------+----------+---------+------------------+
# | Market Status        | Yes      | pandas  | pandas = local   |
# | News                 | Yes      | finnhub | 60 req/min free  |
# | Snapshots (bulk)     | Yes      | No      | Alpaca = single  |
# | Aggregates           | Yes      | No      | No free option   |
# | Reference/Tickers    | Yes      | No      | No free option   |
# | Economic/Fed         | Yes      | No      | FRED planned     |
# +----------------------+----------+---------+------------------+

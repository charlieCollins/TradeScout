<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Radar/Scanner outer ring -->
  <circle cx="100" cy="100" r="70" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="100" cy="100" r="55" fill="#ffffff"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.2"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.3"/>
  
  <!-- Radar sweep/beam -->
  <path d="M 100 100 L 100 30 A 70 70 0 0 1 161 65 Z" fill="url(#blueGrad)" opacity="1"/>
  
  <!-- Rising bar chart elements -->
  <rect x="68" y="110" width="14" height="20" fill="url(#greenGrad)" rx="2"/>
  <rect x="86" y="100" width="14" height="30" fill="url(#greenGrad)" rx="2"/>
  <rect x="104" y="85" width="14" height="45" fill="url(#greenGrad)" rx="2"/>
  <rect x="122" y="70" width="14" height="60" fill="url(#greenGrad)" rx="2"/>
  
  <!-- Center dot/target -->
  <circle cx="100" cy="100" r="4" fill="#3B82F6"/>
</svg>
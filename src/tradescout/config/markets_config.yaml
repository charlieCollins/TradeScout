# TradeScout Supported Markets Configuration
# Defines which markets and exchanges we support for trading analysis

# Geographic Focus
geographic_scope: "US"  # Starting with US markets only

# Supported Exchanges
supported_exchanges:
  nasdaq:
    name: "NASDAQ Stock Market"
    market_id: "NASDAQ"
    country: "US"
    currency: "USD"
    timezone: "America/New_York"
    
    # Trading Hours (Eastern Time)
    regular_hours:
      open: "09:30"
      close: "16:00"
    
    extended_hours:
      premarket_start: "04:00"
      premarket_end: "09:30" 
      afterhours_start: "16:00"
      afterhours_end: "20:00"
    
    trading_days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
    
    # Market Characteristics
    tick_size: 0.01
    lot_size: 1
    
    # Asset Types Supported
    supported_assets:
      - "common_stock"
      - "preferred_stock" 
      - "etf"
    
    # Priority for this market
    priority: 1
    enabled: true
    
  nyse:
    name: "New York Stock Exchange"
    market_id: "NYSE"
    country: "US"
    currency: "USD"
    timezone: "America/New_York"
    
    # Trading Hours (Eastern Time) - same as NASDAQ
    regular_hours:
      open: "09:30"
      close: "16:00"
    
    extended_hours:
      premarket_start: "04:00"
      premarket_end: "09:30"
      afterhours_start: "16:00" 
      afterhours_end: "20:00"
    
    trading_days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
    
    # Market Characteristics
    tick_size: 0.01
    lot_size: 1
    
    # Asset Types Supported
    supported_assets:
      - "common_stock"
      - "preferred_stock"
      - "etf"
      - "reit"
    
    # Priority for this market
    priority: 2
    enabled: true

# Market Categories for Analysis
market_categories:
  # Markets where we identify trading candidates
  candidate_identification:
    description: "Markets where we identify specific securities for trading analysis"
    markets:
      - "nasdaq"
      - "nyse"
  
  # Markets used only for sentiment/directional analysis (future)
  sentiment_indicators:
    description: "Markets used for overall financial sentiment and direction analysis"
    enabled: false
    markets:
      # North American
      - "tsx"      # Toronto Stock Exchange
      
      # European  
      - "lse"      # London Stock Exchange
      - "dax"      # DAX (Germany)
      - "cac40"    # CAC 40 (France)
      - "ftse"     # FTSE 100 (UK)
      
      # Asian-Pacific
      - "nikkei"   # Nikkei 225 (Japan)
      - "hkex"     # Hong Kong Exchange
      - "asx"      # Australian Securities Exchange
      
      # Chinese Markets (Major sentiment indicators)
      - "sse"      # Shanghai Stock Exchange
      - "szse"     # Shenzhen Stock Exchange  
      - "csi300"   # CSI 300 Index
      - "chinext"  # ChiNext (Growth board)
      - "star"     # STAR Market (Tech board)
  
  # Primary focus for all current operations
  primary_focus:
    - "nasdaq"
    - "nyse"

# Trading Sessions Configuration
trading_sessions:
  premarket:
    name: "Pre-Market"
    start_time: "04:00"
    end_time: "09:30"
    timezone: "America/New_York"
    enabled: true
    
  regular:
    name: "Regular Hours"  
    start_time: "09:30"
    end_time: "16:00"
    timezone: "America/New_York"
    enabled: true
    
  afterhours:
    name: "After Hours"
    start_time: "16:00" 
    end_time: "20:00"
    timezone: "America/New_York"
    enabled: true

# Analysis Focus
analysis_focus:
  description: "US equity markets focusing on NASDAQ and NYSE listed securities"
  
  target_securities:
    - "Large cap stocks (>$10B market cap)"
    - "Mid cap stocks ($2B-$10B market cap)" 
    - "High volume ETFs"
    - "NASDAQ 100 constituents"
    - "S&P 500 constituents"
    - "Russell 2000 constituents"
  
  excluded_securities:
    - "Pink sheet stocks"
    - "Penny stocks (<$1.00)"
    - "Low volume securities (<100K daily volume)"
    - "Foreign ADRs (initially)"

# Market Data Requirements
data_requirements:
  minimum_volume: 100000      # 100K daily volume minimum
  minimum_price: 1.00         # $1.00 minimum price
  minimum_market_cap: 100000000  # $100M market cap minimum
  
  required_data_types:
    - "real_time_quotes"
    - "extended_hours_data"
    - "historical_prices"
    - "volume_data"
    - "news_data"
    - "fundamental_data"

# Holidays (US Market Closures)
market_holidays:
  description: "US market holidays when NASDAQ and NYSE are closed"
  holidays:
    - "New Year's Day"
    - "Martin Luther King Jr. Day" 
    - "Presidents Day"
    - "Good Friday"
    - "Memorial Day"
    - "Juneteenth"
    - "Independence Day" 
    - "Labor Day"
    - "Thanksgiving Day"
    - "Christmas Day"
    
  early_close_days:
    - "Black Friday (1 PM close)"
    - "Christmas Eve (1 PM close if weekday)"
    - "New Year's Eve (1 PM close if weekday)"
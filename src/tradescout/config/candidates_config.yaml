# TradeScout Candidate Identification Configuration
# Rules and thresholds for identifying trading candidates
#
# These parameters control what securities qualify as potential trades
# based on technical analysis, volume patterns, and risk management rules

# Gap Trading Rules
gap_trading:
  description: "Rules for identifying gap-up and gap-down trading opportunities"
  
  # Minimum gap percentage to consider (Academic threshold from research)
  min_gap_percentage: 2.0  # 2% minimum gap - Plastun et al. (2019)
  max_gap_percentage: 5.0   # 5% maximum gap (avoid exhaustion gaps per rules)
  
  # Market mover limits for gap candidate sourcing
  market_movers_limit: 1000  # Fetch 1000 gainers + 1000 losers for gap analysis
  
  # Gap direction preferences
  gap_up_enabled: true     # Trade gap-up opportunities
  gap_down_enabled: false  # Skip gap-down (focus on bullish moves)
  
  # Time-based gap rules
  gap_timeframe_minutes: 15  # Gap must occur within first 15 minutes
  minimum_settlement_time: 5  # Wait 5 minutes after gap for price settlement

# Volume Analysis Rules  
volume_analysis:
  description: "Volume surge and unusual activity detection"
  
  # Volume surge thresholds (Academic research-based)
  min_volume_surge_ratio: 2.0     # 2x average daily volume minimum - GAP_TRADING_STRATEGY_RULES.md
  exceptional_volume_ratio: 10.0   # 10x+ volume = exceptional opportunity
  
  # Volume validation  
  minimum_absolute_volume: 500000  # 500K minimum daily volume - GAP_TRADING_STRATEGY_RULES.md
  volume_lookback_days: 20         # Calculate average over 20 trading days
  
  # Pre-market/After-hours volume
  extended_hours_volume_ratio: 2.0  # 2x normal extended hours volume

# Price Movement Thresholds
price_movement:
  description: "Price change and momentum requirements"
  
  # Percentage change thresholds
  min_price_change_percent: 0.5    # 0.5% minimum movement
  max_price_change_percent: 20.0   # 20% maximum (avoid pump & dumps)
  
  # Momentum requirements
  consistent_direction_minutes: 10  # 10 minutes of consistent movement
  momentum_acceleration: true      # Require accelerating momentum
  
  # Support/Resistance levels
  respect_key_levels: true         # Check for bounce off key levels
  key_level_tolerance: 0.2         # 0.2% tolerance around key levels

# Market Cap and Liquidity Filters
liquidity_filters:
  description: "Market cap and trading liquidity requirements"
  
  # Market capitalization thresholds
  min_market_cap_millions: 1000    # $1B minimum market cap
  max_market_cap_millions: 500000  # $500B maximum (avoid mega-caps)
  
  # Price per share filters
  min_share_price: 5.0             # $5 minimum share price
  max_share_price: 1000.0          # $1000 maximum share price
  
  # Spread requirements
  max_bid_ask_spread_percent: 1.0  # 1.0% maximum bid-ask spread - GAP_TRADING_STRATEGY_RULES.md
  
# Risk Management Rules
risk_management:
  description: "Position sizing and risk control parameters"
  
  # Position sizing (Academic research-based)
  max_position_size_percent: 2.0   # 2% maximum position risk - GAP_TRADING_STRATEGY_RULES.md
  default_position_size_percent: 1.0  # 1% standard position size
  
  # Risk thresholds (Academic research-based)  
  max_daily_risk_percent: 4.0      # 4% maximum daily portfolio risk - GAP_TRADING_STRATEGY_RULES.md
  max_single_stock_risk: 2.0       # 2% maximum risk per single position
  
  # Stop loss requirements (Academic research-based)
  require_stop_loss: true          # Always require stop loss
  default_stop_loss_percent: 2.0   # 2% default stop loss - GAP_TRADING_STRATEGY_RULES.md
  max_stop_loss_percent: 2.0       # 2% maximum stop loss allowed

# Candidate Scoring and Selection
scoring:
  description: "How candidates are scored and ranked"
  
  # Confidence scoring
  confidence_threshold: 0.55       # 55% minimum (win_rate_target from research)
  exceptional_confidence: 0.75     # 75%+ = exceptional opportunity
  
  # Daily limits (Academic research limits)
  max_suggestions_per_day: 3       # Maximum 3 candidates per day - GAP_TRADING_STRATEGY_RULES.md
  max_candidates_per_session: 3    # Maximum 3 concurrent positions
  
  # Scoring weights (must sum to 1.0)
  scoring_weights:
    volume_surge: 0.30             # 30% weight on volume
    gap_size: 0.25                 # 25% weight on gap magnitude
    momentum: 0.20                 # 20% weight on momentum
    liquidity: 0.15                # 15% weight on liquidity
    technical_setup: 0.10          # 10% weight on technical patterns

# Time-Based Rules
timing:
  description: "Time-based candidate identification rules"
  
  # Trading sessions
  regular_hours_only: false        # Allow extended hours candidates
  best_opportunity_window: "09:30-10:30"  # Best window for gap plays
  
  # Candidate refresh
  scan_frequency_minutes: 5        # Rescan every 5 minutes during market
  candidate_staleness_minutes: 30  # Candidates expire after 30 minutes
  
  # Market conditions
  avoid_fomc_days: true            # Skip FOMC announcement days
  avoid_earnings_season: false     # Allow earnings season trades
  avoid_market_open_minutes: 2     # Skip first 2 minutes of market open

# News and Catalyst Integration
catalysts:
  description: "News and catalyst-based candidate enhancement"
  
  # News requirements
  require_news_catalyst: false     # News catalyst not required but preferred
  news_sentiment_weight: 0.15      # 15% boost for positive news sentiment
  
  # Catalyst types (when news integration is available)
  preferred_catalysts:
    - "earnings_beat"              # Earnings beats
    - "analyst_upgrade"            # Analyst upgrades  
    - "product_announcement"       # Product launches
    - "acquisition_rumor"          # M&A rumors
    - "regulatory_approval"        # FDA/regulatory approvals
  
  # News timing
  news_recency_hours: 24          # Consider news from last 24 hours
  breaking_news_boost: 0.25       # 25% boost for breaking news (<1 hour)

# Exclusion Rules
exclusions:
  description: "Securities and conditions to exclude from candidates"
  
  # Sector exclusions
  excluded_sectors: []             # No sector exclusions currently
  
  # Security type exclusions  
  excluded_asset_types:
    - "penny_stock"               # No penny stocks
    - "otc"                       # No OTC securities
    - "preferred_stock"           # Focus on common stock only
  
  # Pattern exclusions
  exclude_patterns:
    - "pump_and_dump"             # Exclude obvious P&D patterns
    - "low_float_squeeze"         # Exclude low float squeezes  
    - "reverse_split_recovery"    # Exclude recent reverse split recovery
  
  # Timing exclusions
  exclude_times:
    - "market_close_5min"         # Exclude last 5 minutes of trading
    - "lunch_hour"                # Exclude 12:00-13:00 EST (low volume)

# Backtesting and Validation
validation:
  description: "Rules for validating candidate identification logic"
  
  # Historical validation
  backtest_lookback_days: 252     # 1 year backtesting period
  min_historical_success_rate: 0.60  # 60% minimum historical success rate
  
  # Forward testing
  paper_trade_new_rules: true     # Paper trade new rules first
  min_paper_trade_samples: 50     # 50 paper trades before live implementation
  
  # Performance tracking
  track_candidate_performance: true    # Track all candidate outcomes
  performance_review_frequency: "weekly"  # Weekly performance reviews
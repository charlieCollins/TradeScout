# TradeScout Data Sources Configuration
# Single provider configuration - Polygon.io Paid Account
# Documentation: https://polygon.io/docs
#
# Polygon Market Coverage:
# - Real-time and historical market data for stocks, options, forex, crypto
# - Extended hours trading data (pre-market 4AM-9:30AM, after-hours 4PM-8PM EST)
# - Comprehensive market coverage with tick-level data streams
# - Note: Extended hour trades may have Sale Conditions affecting aggregates


# Data Source Definitions
providers:
  polygon:
    name: "Polygon.io"
    type: "api"
    provider_type: "commercial"
    documentation_url: "https://polygon.io/docs"
    rate_limit_per_minute: 300  # Varies by subscription tier
    supports_extended_hours: true
    supports_market_movers: true
    supports_news: true
    supports_fundamentals: true
    supports_crypto: true
    supports_forex: true
    api_key_required: true
    priority: 1
    enabled: true
    base_url: "https://api.polygon.io"
    timeout_seconds: 15
  
  tiingo:
    name: "Tiingo"
    type: "api"
    provider_type: "commercial"
    documentation_url: "https://www.tiingo.com/documentation/general/overview"
    rate_limit_per_minute: 1000
    supports_extended_hours: true
    supports_market_movers: true
    supports_news: true
    supports_fundamentals: true
    supports_crypto: true
    supports_forex: true
    api_key_required: true
    priority: 2
    enabled: false  # Disabled - switching to Polygon
    base_url: "https://api.tiingo.com"
    timeout_seconds: 15


# Data Type Configurations
# All data types use Polygon as the primary source
data_types:
  
  # Real-time and current market data
  current_quotes:
    description: "Current stock prices and basic market data"
    providers: ["polygon"]
    cache_ttl_minutes: 1
    
  historical_prices:
    description: "Historical OHLCV data"
    providers: ["polygon"]
    cache_ttl_hours: 24
    
  extended_hours:
    description: "Extended hours trading data (pre-market and after-hours)"
    providers: ["polygon"]
    cache_ttl_minutes: 5
    
  # Company and fundamental data
  company_fundamentals:
    description: "Company profile, financials, and basic stats"
    providers: ["polygon"]
    cache_ttl_days: 7
    
  financial_statements:
    description: "Income statement, balance sheet, cash flow"
    providers: ["polygon"]
    cache_ttl_days: 90
    
  earnings_data:
    description: "Earnings history and estimates"
    providers: ["polygon"]
    cache_ttl_days: 1
    
  # Market analysis data
  volume_analysis:
    description: "Volume patterns and unusual volume detection"
    providers: ["polygon"]
    cache_ttl_minutes: 15
    
  technical_indicators:
    description: "RSI, MACD, moving averages, etc."
    providers: ["polygon"]
    cache_ttl_minutes: 15
    
  market_movers:
    description: "Top gainers, losers, most active stocks"
    providers: ["polygon"]
    cache_ttl_minutes: 15
    
  # News and sentiment data
  company_news:
    description: "Company-specific news and press releases"
    providers: ["polygon"]
    cache_ttl_minutes: 30
    
  market_news:
    description: "General market and sector news"
    providers: ["polygon"]
    cache_ttl_minutes: 15
    
  sentiment_analysis:
    description: "Social sentiment and news sentiment analysis"
    providers: ["polygon"]
    cache_ttl_minutes: 15
    
  analyst_ratings:
    description: "Analyst recommendations and price targets"
    providers: ["polygon"]
    cache_ttl_hours: 6

# Rate Limiting Configuration
rate_limiting:
  enabled: true
  burst_allowance: 10  # Allow brief bursts above limit
  backoff_strategy: "exponential"  # linear, exponential, or fixed
  max_retry_attempts: 3
  retry_delay_seconds: 1

# Error Handling
error_handling:
  max_failures_before_disable: 5  # Disable provider after N consecutive failures
  failure_window_minutes: 10      # Reset failure count after this window
  circuit_breaker_enabled: true   # Temporarily disable failing providers
  fallback_to_cache: true         # Use cached data if provider fails
  max_cache_age_hours: 24         # Maximum age of cached data to use as fallback

# Development and Testing
development:
  mock_providers: false           # Use mock data instead of real APIs
  log_all_requests: false        # Log every API request (verbose)
  simulate_failures: false       # Randomly fail requests for testing
  offline_mode: false           # Use only cached data, no API calls
# Cache Configuration
# Time-to-live (TTL) values in minutes for different data types

cache_policies:
  # Real-time market data (quotes, snapshots, movers)
  real_time: 10  # 10 minutes for real-time pricing data
  
  # Intraday pricing data
  intraday: 10  # 10 minutes for intraday pricing data
  
  # Extended hours data
  premarket: 10  # 10 minutes for pre-market extended hours
  afterhours: 10  # 10 minutes for after-hours extended hours
  
  # Daily/historical data
  daily: 240  # 4 hours for daily summaries
  
  # Fundamental data (company info, financials)
  fundamental: 10080  # 1 week for fundamental data
  
  # Historical price data
  historical: 43200  # 30 days for historical data

# Cache directory configuration  
cache_directory: "data/cache"

# Maximum cache size in MB (optional)
max_cache_size_mb: 500

# Cache cleanup settings
cleanup:
  # Run cleanup when cache exceeds this percentage of max size
  cleanup_threshold_percent: 90
  # Remove entries older than this many days
  max_age_days: 30